<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mira — Calls Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; }
  header { padding: 1rem 1.5rem; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 1.1rem; margin: 0; }
  header a { color: #94a3b8; text-decoration: none; font-size: 0.85rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { padding: 0.6rem 0.8rem; text-align: left; border-bottom: 1px solid #1e293b; white-space: nowrap; }
  th { color: #94a3b8; font-weight: 600; position: sticky; top: 0; background: #0f172a; }
  tr:hover { background: #1e293b; cursor: pointer; }
  .tag { padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
  .Hot { background: #7f1d1d; color: #fecaca; }
  .Warm { background: #78350f; color: #fed7aa; }
  .Cold { background: #1e3a8a; color: #bfdbfe; }
  .model-gemini { color: #4ade80; font-weight: 600; }
  .model-openai { color: #f87171; font-weight: 600; }
  #detail { position: fixed; top: 0; right: -420px; width: 420px; height: 100vh; background: #1e293b;
            transition: right 0.2s; padding: 1.5rem; overflow-y: auto; }
  #detail.open { right: 0; }
  #detail h2 { font-size: 1rem; margin-top: 0; }
  #detail .msg { margin-bottom: 0.6rem; padding: 0.5rem 0.7rem; border-radius: 8px; font-size: 0.85rem; }
  #detail .user { background: #0f172a; }
  #detail .assistant { background: #312e81; }
  #detail .close { float: right; cursor: pointer; color: #94a3b8; }
  #wrap { overflow-x: auto; max-width: 100vw; padding: 1rem 1.5rem; }
</style>
</head>
<body>
<header>
  <h1>Mira — Calls Dashboard</h1>
  <a href="/logout">Log out</a>
</header>
<div id="wrap">
  <table>
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Company</th><th>Phone</th><th>Interest</th>
        <th>Classification</th><th>Budget</th><th>Timeline</th><th>Decision Maker</th>
        <th>Booked</th><th>Meeting</th><th>Model</th><th>Cost</th><th>Cost/min</th><th>Updated</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<div id="detail">
  <span class="close" onclick="closeDetail()">close &times;</span>
  <h2 id="detail-title"></h2>
  <div id="detail-transcript"></div>
</div>

<script>
let calls = [];

async function load() {
  const res = await fetch('/api/calls');
  if (res.status === 401) { window.location = '/login'; return; }
  calls = await res.json();
  const rows = document.getElementById('rows');
  rows.innerHTML = calls.map((c, i) => `
    <tr onclick="openDetail(${i})">
      <td>${c.id ?? ''}</td>
      <td>${esc(c.name)}</td>
      <td>${esc(c.company)}</td>
      <td>${esc(c.phone_number)}</td>
      <td>${esc(c.interest_area)}</td>
      <td>${c.classification ? `<span class="tag ${c.classification}">${c.classification}</span>` : ''}</td>
      <td>${esc(c.budget)}</td>
      <td>${esc(c.timeline)}</td>
      <td>${esc(c.decision_maker_status)}</td>
      <td>${c.discovery_call_scheduled ? '✓' : ''}</td>
      <td>${c.meeting_link ? `<a href="${c.meeting_link}" target="_blank" onclick="event.stopPropagation()">link</a>` : ''}</td>
      <td>${modelLabel(c)}</td>
      <td>${c.cost_usd != null ? '$' + Number(c.cost_usd).toFixed(4) : ''}</td>
      <td>${costPerMin(c)}</td>
      <td>${esc(c.updated_at)}</td>
    </tr>
  `).join('');
}

function costPerMin(c) {
  const durS = c.lead_state?.call_metrics?.call_duration_s;
  if (c.cost_usd == null || !durS) return '';
  return '$' + (c.cost_usd / (durS / 60)).toFixed(4) + '/min';
}

function modelLabel(c) {
  const engine = c.lead_state?.call_metrics?.engine;
  const model = c.lead_state?.call_metrics?.model;
  if (!model) return '';
  const cls = engine === 'gemini' ? 'model-gemini' : engine === 'openai' ? 'model-openai' : '';
  return `<span class="${cls}">${esc(model)}</span>`;
}

function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function openDetail(i) {
  const c = calls[i];
  document.getElementById('detail-title').textContent = `${c.name} — ${c.company}`;
  const t = (c.transcript || []).map(m =>
    `<div class="msg ${m.role}"><strong>${m.role}:</strong> ${esc(m.content)}</div>`
  ).join('') || '<em>No transcript yet.</em>';
  document.getElementById('detail-transcript').innerHTML = t;
  document.getElementById('detail').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail').classList.remove('open');
}

load();
setInterval(load, 15000);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mira — Leads</title>
<link rel="stylesheet" href="/static/dashboard-light.css?v=6">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <span class="mark">M</span>
        <div class="brand-text">
          <h1>Mira</h1>
          <div class="tagline">Swaran Soft</div>
        </div>
      </div>
      <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar"></button>
    </div>
    <nav class="side-nav">
      <a href="/dashboard/master"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M8 17V10M13 17V6M18 17v-4"/></svg><span class="nav-label">Master Dashboard</span></a>
      <a href="/dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 8a4 4 0 0 1 4 4M15 4a8 8 0 0 1 8 8M22 16.9v2.6a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 3.8 2 2 0 0 1 4.1 1.6h2.6a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L7.6 9.6a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/></svg><span class="nav-label">Outbound</span></a>
      <a href="/dashboard/inbound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v2.6a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 3.8 2 2 0 0 1 4.1 1.6h2.6a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L7.6 9.6a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/><path d="M14 4h6v6M20 4l-7 7"/></svg><span class="nav-label">Inbound</span></a>
      <a href="/dashboard/meetings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/></svg><span class="nav-label">Meetings</span></a>
      <a href="/dashboard/leads" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="nav-label">Leads</span></a>
    </nav>
    <a href="/logout" class="logout-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg><span class="nav-label">Log out</span></a>
  </aside>

  <div class="main-area">
    <div class="page-topbar">
      <div>
        <h2>Leads</h2>
        <p>Every contact, one profile</p>
      </div>
      <div class="leads-filter" id="leads-filter-buttons"></div>
    </div>
    <div id="wrap">
      <div class="stat-grid stat-grid-6up" id="kpis"></div>

      <table class="calls">
        <thead>
          <tr>
            <th>Name</th><th>Phone</th><th>Classification</th><th>Calls</th><th>Interest</th><th>Meeting</th><th>Cost</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">No leads yet.</div>
    </div>
  </div>
</div>

<div id="overlay" onclick="closeDetail()"></div>
<div id="detail">
  <div class="dhead">
    <button class="dclose" onclick="closeDetail()" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div id="d-avatar-wrap"></div>
    <p class="dname" id="d-name"></p>
    <p class="dsub" id="d-sub"></p>
  </div>
  <div id="d-body"></div>
</div>

<script src="/static/dashboard-common.js?v=7"></script>
<script>
let allCalls = [];
let contacts = [];
let filter = 'all';

function renderFilterButtons() {
  const buttons = ['all', 'Hot', 'Warm', 'Cold'].map(f => `
    <button class="${f === filter ? 'active' : ''}" onclick="setFilter('${f}')">${f === 'all' ? 'All' : f}</button>
  `).join('');
  document.getElementById('leads-filter-buttons').innerHTML = buttons;
}

function setFilter(f) {
  filter = f;
  renderFilterButtons();
  renderTable();
}

function renderTable() {
  const filtered = filter === 'all' ? contacts : contacts.filter(c => c.bestClassification === filter);

  document.getElementById('kpis').innerHTML = renderKpiRow(allCalls, [
    { icon: 'userCheck', accent: '--brand', label: 'Distinct leads', val: contacts.length.toLocaleString(), sub: 'every contact, both directions' },
  ]);

  const rows = document.getElementById('rows');
  document.getElementById('empty').style.display = filtered.length ? 'none' : 'block';
  document.getElementById('empty').innerHTML = filtered.length ? '' : `${ICON.inbox}<div>No leads match this filter.</div>`;

  // Classification/booking status/cost all come from the contact aggregate
  // (best-ever classification, ever-booked, total cost across every call),
  // same convention as the Outbound/Inbound dashboards — see
  // groupCallsByContact's docstring.
  rows.innerHTML = filtered.map((ct) => `
    <tr onclick="openLead('${ct.key}')">
      <td class="name-cell">${avatar(ct.displayName, ct.bestClassification)}${esc(ct.displayName) || '<span class="muted">Unknown</span>'}</td>
      <td class="mono">${esc(ct.latest.phone_number) || '<span class="muted">—</span>'}</td>
      <td>${classificationTag(ct.bestClassification)}</td>
      <td>${callCountBadge(ct)}</td>
      <td>${esc(ct.displayInterestArea) || '<span class="muted">—</span>'}</td>
      <td>${meetingBadge({ discovery_call_scheduled: ct.everBooked, meeting_link: ct.bookedMeetingLink })}</td>
      <td class="mono">${ct.totalCostInr != null ? '₹' + Number(ct.totalCostInr).toFixed(2) : '<span class="muted">—</span>'}</td>
    </tr>
  `).join('');
}

async function load() {
  const res = await fetch('/api/calls');
  if (res.status === 401) { window.location = '/login'; return; }
  allCalls = await res.json();
  contacts = groupCallsByContact(allCalls);
  renderFilterButtons();
  renderTable();
}

// Opens the slide-in panel immediately with the contact's own already-known
// facts, then fetches the AI analysis (POST /api/leads/insights — see
// core/lead_insights.py) and re-renders once it resolves, rather than
// blocking the panel open on a network+model round trip.
async function openLead(key) {
  const contact = contacts.find(c => c.key === key);
  if (!contact) return;

  document.getElementById('d-avatar-wrap').innerHTML = avatar(contact.displayName, contact.bestClassification).replace('class="avatar"', 'class="avatar davatar"');
  document.getElementById('d-name').textContent = contact.displayName || 'Unknown lead';
  document.getElementById('d-sub').innerHTML = `${esc(contact.latest.phone_number) || ''}${callCountBadge(contact)}`;
  document.getElementById('d-body').innerHTML = renderLeadInsightBody(contact, null);
  document.getElementById('detail').classList.add('open');
  document.getElementById('overlay').classList.add('open');

  try {
    const res = await fetch('/api/leads/insights', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ calls: contact.calls }),
    });
    if (res.status === 401) { window.location = '/login'; return; }
    const insight = await res.json();
    // The panel may have moved on to a different lead by the time this
    // resolves — only paint if this contact is still the one showing.
    if (document.getElementById('d-name').textContent === (contact.displayName || 'Unknown lead')) {
      document.getElementById('d-body').innerHTML = renderLeadInsightBody(contact, insight);
    }
  } catch (e) {
    document.getElementById('d-body').innerHTML = renderLeadInsightBody(contact, { generated: false, facts: {} });
  }
}

function closeDetail() {
  document.getElementById('detail').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });

initSidebar();
load();
setInterval(load, 15000);
</script>
</body>
</html>

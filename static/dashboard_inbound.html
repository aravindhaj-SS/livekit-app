<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mira — Inbound Calls</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; }
  header { padding: 1rem 1.5rem; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
  nav { display: flex; align-items: center; gap: 1.25rem; }
  nav a { color: #94a3b8; text-decoration: none; font-size: 0.85rem; padding: 0.35rem 0.7rem; border-radius: 6px; }
  nav a.active { color: #e2e8f0; background: #1e293b; }
  nav a:hover:not(.active) { color: #cbd5e1; }

  #wrap { padding: 1.25rem 1.5rem; max-width: 1100px; margin: 0 auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { padding: 0.75rem 0.9rem; text-align: left; }
  th { color: #64748b; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 1px solid #1e293b; }
  tbody tr { border-bottom: 1px solid #1a2436; cursor: pointer; transition: background 0.1s; }
  tbody tr:hover { background: #172033; }
  td.name { font-weight: 600; color: #f1f5f9; }
  td.muted { color: #64748b; }

  .tag { padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
  .Hot { background: #7f1d1d; color: #fecaca; }
  .Warm { background: #78350f; color: #fed7aa; }
  .Cold { background: #1e3a8a; color: #bfdbfe; }

  .badge { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; }
  .badge.yes { color: #86efac; }
  .badge.no { color: #475569; }
  .badge a { color: #93c5fd; text-decoration: none; }
  .badge a:hover { text-decoration: underline; }

  .empty { text-align: center; color: #64748b; padding: 3rem 0; }

  /* ── Slide-in detail panel ─────────────────────────────────────────── */
  #overlay { position: fixed; inset: 0; background: rgba(2,6,23,0.55); opacity: 0; pointer-events: none;
             transition: opacity 0.2s; z-index: 10; }
  #overlay.open { opacity: 1; pointer-events: auto; }

  #detail { position: fixed; top: 0; right: -480px; width: 480px; max-width: 92vw; height: 100vh;
            background: #111a2e; border-left: 1px solid #1e293b; transition: right 0.25s ease;
            overflow-y: auto; z-index: 11; }
  #detail.open { right: 0; }

  #detail .dhead { position: sticky; top: 0; background: #111a2e; padding: 1.25rem 1.5rem 1rem;
                   border-bottom: 1px solid #1e293b; z-index: 1; }
  #detail .dclose { position: absolute; top: 1rem; right: 1.25rem; cursor: pointer; color: #64748b;
                     font-size: 1.3rem; line-height: 1; background: none; border: none; padding: 0.25rem; }
  #detail .dclose:hover { color: #e2e8f0; }
  #detail .dname { font-size: 1.15rem; font-weight: 700; color: #f8fafc; margin: 0 0 0.2rem; padding-right: 2rem; }
  #detail .dsub { color: #94a3b8; font-size: 0.85rem; }

  #detail .section { padding: 1.1rem 1.5rem; border-bottom: 1px solid #1a2436; }
  #detail .section h3 { margin: 0 0 0.7rem; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em;
                         color: #64748b; font-weight: 700; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 0.4rem 0.75rem; font-size: 0.87rem; }
  .kv dt { color: #64748b; }
  .kv dd { margin: 0; color: #e2e8f0; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .tile { background: #172033; border: 1px solid #1e293b; border-radius: 8px; padding: 0.6rem 0.8rem; }
  .tile .tlabel { color: #64748b; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .tile .tval { color: #f1f5f9; font-size: 1.05rem; font-weight: 700; margin-top: 0.15rem; }
  .tile .tsub { color: #64748b; font-size: 0.72rem; margin-top: 0.1rem; }

  .priced-against { color: #64748b; font-size: 0.78rem; margin: -0.3rem 0 0.8rem; }
  .priced-against code { color: #93c5fd; background: #0f172a; padding: 0.05rem 0.35rem; border-radius: 4px; }
  table.utable { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 0.7rem; }
  table.utable th { color: #64748b; font-weight: 600; text-align: right; font-size: 0.68rem;
                    text-transform: uppercase; padding: 0.3rem 0.4rem; border-bottom: 1px solid #1e293b; }
  table.utable th:first-child { text-align: left; }
  table.utable td { padding: 0.35rem 0.4rem; text-align: right; border-bottom: 1px solid #16202f; color: #e2e8f0; }
  table.utable td:first-child { text-align: left; color: #94a3b8; }
  table.utable tr.total td { font-weight: 700; color: #f8fafc; border-top: 1px solid #1e293b; border-bottom: none; }

  audio { width: 100%; height: 34px; }
  .no-recording { color: #475569; font-size: 0.85rem; font-style: italic; }

  .transcript { display: flex; flex-direction: column; gap: 0.5rem; }
  .msg { padding: 0.5rem 0.75rem; border-radius: 8px; font-size: 0.85rem; line-height: 1.4; max-width: 92%; }
  .msg.user { background: #172033; align-self: flex-start; }
  .msg.assistant { background: #2a2564; align-self: flex-end; }
  .msg .role { display: block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.04em;
               color: #64748b; margin-bottom: 0.2rem; }
</style>
</head>
<body>
<header>
  <h1>Mira — Calls</h1>
  <nav>
    <a href="/dashboard">Outbound</a>
    <a href="/dashboard/inbound" class="active">Inbound</a>
    <a href="/logout">Log out</a>
  </nav>
</header>
<div id="wrap">
  <table>
    <thead>
      <tr><th>Name</th><th>Budget</th><th>Timeline</th><th>Decision Maker</th><th>Meeting</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">No inbound calls yet.</div>
</div>

<div id="overlay" onclick="closeDetail()"></div>
<div id="detail">
  <div class="dhead">
    <button class="dclose" onclick="closeDetail()" aria-label="Close">&times;</button>
    <p class="dname" id="d-name"></p>
    <p class="dsub" id="d-sub"></p>
  </div>
  <div id="d-body"></div>
</div>

<script>
let calls = [];

async function load() {
  const res = await fetch('/api/calls?direction=inbound');
  if (res.status === 401) { window.location = '/login'; return; }
  calls = await res.json();
  const rows = document.getElementById('rows');
  document.getElementById('empty').style.display = calls.length ? 'none' : 'block';
  rows.innerHTML = calls.map((c, i) => `
    <tr onclick="openDetail(${i})">
      <td class="name">${esc(c.name) || '<span class="muted">Unknown caller</span>'}</td>
      <td>${esc(c.budget) || '<span class="muted">—</span>'}</td>
      <td>${esc(c.timeline) || '<span class="muted">—</span>'}</td>
      <td>${esc(c.decision_maker_status) || '<span class="muted">—</span>'}</td>
      <td>${meetingBadge(c)}</td>
    </tr>
  `).join('');
}

function meetingBadge(c) {
  if (c.discovery_call_scheduled && c.meeting_link) {
    return `<span class="badge yes">✓ <a href="${c.meeting_link}" target="_blank" onclick="event.stopPropagation()">link</a></span>`;
  }
  if (c.discovery_call_scheduled) return `<span class="badge yes">✓ booked</span>`;
  return `<span class="badge no">—</span>`;
}

function esc(v) {
  if (v === null || v === undefined || v === '') return '';
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmt(v, fallback) {
  return (v === null || v === undefined || v === '') ? (fallback ?? '<span class="muted">Not captured yet</span>') : esc(v);
}

function openDetail(i) {
  const c = calls[i];
  document.getElementById('d-name').textContent = c.name || 'Unknown caller';
  document.getElementById('d-sub').textContent = [c.phone_number, c.classification].filter(Boolean).join(' · ');

  const aiCost = c.cost_usd != null ? '$' + Number(c.cost_usd).toFixed(4) : '—';
  const exotelCost = c.exotel_cost_inr != null ? '₹' + Number(c.exotel_cost_inr).toFixed(2) : '—';
  const totalCostV = c.total_cost_inr != null ? '₹' + Number(c.total_cost_inr).toFixed(2) : '—';
  const latency = c.avg_latency_s != null ? Number(c.avg_latency_s).toFixed(2) + 's' : '—';

  const priced = c.engine
    ? `<p class="priced-against">Priced against <code>${esc(c.engine)}</code> / <code>${esc(c.model || '—')}</code></p>`
    : '';

  const recordingHtml = c.recording_url
    ? `<audio controls src="${c.recording_url}"></audio>`
    : `<p class="no-recording">No recording available for this call.</p>`;

  const transcriptHtml = (c.transcript || []).length
    ? `<div class="transcript">${c.transcript.map(m => `<div class="msg ${m.role}"><span class="role">${m.role}</span>${esc(m.content)}</div>`).join('')}</div>`
    : `<p class="no-recording">No transcript captured.</p>`;

  const u = c.usage || {};
  const n = (v) => v ?? 0;
  const totalInput = n(u.text_input) + n(u.audio_input);
  const totalOutput = n(u.text_output) + n(u.audio_output);
  const tokenUsageHtml = c.usage ? `
    <div class="tiles">
      <div class="tile"><div class="tlabel">Total input tokens</div><div class="tval">${totalInput.toLocaleString()}</div></div>
      <div class="tile"><div class="tlabel">Total output tokens</div><div class="tval">${totalOutput.toLocaleString()}</div></div>
    </div>
    <table class="utable">
      <thead><tr><th>Breakdown</th><th>Total</th><th>Cached</th></tr></thead>
      <tbody>
        <tr><td>Text input</td><td>${n(u.text_input).toLocaleString()}</td><td>${n(u.text_input_cached).toLocaleString()}</td></tr>
        <tr><td>Audio input</td><td>${n(u.audio_input).toLocaleString()}</td><td>${n(u.audio_input_cached).toLocaleString()}</td></tr>
        <tr><td>Text output</td><td>${n(u.text_output).toLocaleString()}</td><td>—</td></tr>
        <tr><td>Audio output</td><td>${n(u.audio_output).toLocaleString()}</td><td>—</td></tr>
        <tr class="total"><td>Total</td><td>${(totalInput + totalOutput).toLocaleString()}</td><td></td></tr>
      </tbody>
    </table>
  ` : `<p class="no-recording">No token usage recorded for this call.</p>`;

  document.getElementById('d-body').innerHTML = `
    <div class="section">
      <h3>Caller</h3>
      <dl class="kv">
        <dt>Interest area</dt><dd>${fmt(c.interest_area)}</dd>
        <dt>Email</dt><dd>${fmt(c.email_id)}</dd>
      </dl>
    </div>
    <div class="section">
      <h3>Qualification</h3>
      <dl class="kv">
        <dt>Budget</dt><dd>${fmt(c.budget)}</dd>
        <dt>Timeline</dt><dd>${fmt(c.timeline)}</dd>
        <dt>Decision maker</dt><dd>${fmt(c.decision_maker_status)}</dd>
      </dl>
    </div>
    ${c.callback_time ? `
    <div class="section">
      <h3>Callback requested</h3>
      <dl class="kv"><dt>Time</dt><dd>${esc(c.callback_time)}</dd></dl>
    </div>` : ''}
    <div class="section">
      <h3>Cost &amp; latency</h3>
      ${priced}
      <div class="tiles">
        <div class="tile"><div class="tlabel">AI cost</div><div class="tval">${aiCost}</div><div class="tsub">Gemini / OpenAI tokens</div></div>
        <div class="tile"><div class="tlabel">Telephony cost</div><div class="tval">${exotelCost}</div><div class="tsub">Exotel, per-minute</div></div>
        <div class="tile"><div class="tlabel">Total cost</div><div class="tval">${totalCostV}</div><div class="tsub">Blended, INR</div></div>
        <div class="tile"><div class="tlabel">Avg latency / turn</div><div class="tval">${latency}</div><div class="tsub">Time to first audio</div></div>
      </div>
    </div>
    <div class="section">
      <h3>Token usage</h3>
      ${tokenUsageHtml}
    </div>
    <div class="section">
      <h3>Recording</h3>
      ${recordingHtml}
    </div>
    <div class="section">
      <h3>Transcript</h3>
      ${transcriptHtml}
    </div>
  `;

  document.getElementById('detail').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });

load();
setInterval(load, 15000);
</script>
</body>
</html>

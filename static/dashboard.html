<html lang="en">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="/static/dashboard-light.css?v=6">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">

        <span class="mark">M</span>
        <div class="brand-text">
          <h1>Mira</h1>
          <div class="tagline">Swaran Soft</div>
        </div>
      </div>
      <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar"></button>
    </div>
    <nav class="side-nav">
      <a href="/dashboard/master"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M8 17V10M13 17V6M18 17v-4"/></svg><span class="nav-label">Master Dashboard</span></a>
      <a href="/dashboard" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 8a4 4 0 0 1 4 4M15 4a8 8 0 0 1 8 8M22 16.9v2.6a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 3.8 2 2 0 0 1 4.1 1.6h2.6a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L7.6 9.6a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/></svg><span class="nav-label">Outbound</span></a>
      <a href="/dashboard/inbound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v2.6a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 3.8 2 2 0 0 1 4.1 1.6h2.6a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L7.6 9.6a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/><path d="M14 4h6v6M20 4l-7 7"/></svg><span class="nav-label">Inbound</span></a>
      <a href="/dashboard/meetings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/></svg><span class="nav-label">Meetings</span></a>
      <a href="/dashboard/leads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="nav-label">Leads</span></a>
    </nav>
    <a href="/logout" class="logout-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg><span class="nav-label">Log out</span></a>
  </aside>

  <div class="main-area">
    <div class="page-topbar">
      <div>
        <h2>Outbound Calls</h2>
        <p>Swaran Soft voice agent</p>
      </div>
      <button class="models-btn" id="models-btn" onclick="openModelModal()" title="Switch the realtime model for outbound calls">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>
        <span id="model-badge">Loading model…</span>
      </button>
    </div>
    <div id="wrap">
      <div class="stat-grid" id="kpis"></div>

      <table class="calls">
        <thead>
          <tr>
            <th>Name</th><th>Company</th><th>Calls</th><th>Classification</th><th>Meeting</th><th>Cost</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">No outbound calls yet.</div>
    </div>
  </div>
</div>

<div id="overlay" onclick="closeDetail()"></div>
<div id="detail">
  <div class="dhead">
    <button class="dclose" onclick="closeDetail()" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div id="d-avatar-wrap"></div>
    <p class="dname" id="d-name"></p>
    <p class="dsub" id="d-sub"></p>
  </div>
  <div id="d-body"></div>
</div>

<div id="model-overlay" class="modal-overlay" onclick="closeModelModal(event)"></div>
<div id="model-modal" class="modal"></div>

<script src="/static/dashboard-common.js?v=7"></script>
<script>
let calls = [];       // this direction only — unchanged semantics, feeds KPI row + trend
let contacts = [];     // grouped by phone across BOTH directions, filtered to contacts with >=1 outbound call

const DETAIL_OPTS = { interestIcon: 'target', interestLabel: 'Interest', unknownLabel: 'Unknown lead' };

async function load() {
  const res = await fetch('/api/calls');
  if (res.status === 401) { window.location = '/login'; return; }
  const allCalls = await res.json();
  calls = allCalls.filter(c => c.direction === 'outbound');

  // Grouped from the FULL cross-direction list (see groupCallsByContact's
  // docstring) so a contact's arrow badge shows their true inbound+outbound
  // split, then kept only if they have at least one outbound call — this
  // page is still "the outbound dashboard", just one row per contact now
  // instead of one row per call.
  contacts = groupCallsByContact(allCalls).filter(ct => ct.outboundCount > 0);

  const callbacks = calls.filter(c => c.callback_time).length;
  document.getElementById('kpis').innerHTML = renderKpiRow(calls, [
    { icon: 'phoneCallback', accent: '--warm', label: 'Callbacks requested', val: callbacks.toLocaleString(), sub: 'busy — asked to reconnect' },
  ]) + renderTrendCard(calls, 'Outbound call volume');

  const rows = document.getElementById('rows');
  document.getElementById('empty').style.display = contacts.length ? 'none' : 'block';
  document.getElementById('empty').innerHTML = contacts.length ? '' : `${ICON.inbox}<div>No outbound calls yet.</div>`;

  // Classification/booking status/cost below all come from the contact
  // aggregate (best-ever classification, ever-booked, total cost across
  // every call), never from just ct.latest — see groupCallsByContact's
  // docstring for the bug this fixes (a later, shorter call was silently
  // downgrading an already-Hot, already-booked contact).
  rows.innerHTML = contacts.map((ct, i) => `
    <tr onclick="openDetail(${i})">
      <td class="name-cell">${avatar(ct.displayName, ct.bestClassification)}${esc(ct.displayName) || '<span class="muted">Unknown</span>'}</td>
      <td>${esc(ct.displayCompany) || '<span class="muted">—</span>'}</td>
      <td>${callCountBadge(ct)}</td>
      <td>${classificationTag(ct.bestClassification)}</td>
      <td>${meetingBadge({ discovery_call_scheduled: ct.everBooked, meeting_link: ct.bookedMeetingLink })}</td>
      <td class="mono">${totalCost(ct.totalCostInr)}</td>
    </tr>
  `).join('');
}

function totalCost(inr) {
  if (inr == null) return '<span class="muted">—</span>';
  return '₹' + Number(inr).toFixed(2);
}

function openDetail(i) {
  openContactDetail(contacts[i], DETAIL_OPTS);
}

function closeDetail() {
  document.getElementById('detail').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });

initSidebar();
load();
setInterval(load, 15000);
initModelPicker('outbound');
</script>
</body>
</html>

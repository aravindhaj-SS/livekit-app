<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mira — Inbound Calls</title>
<link rel="stylesheet" href="/static/dashboard.css?v=2">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark">M</span>
    <div>
      <h1>Mira — Calls</h1>
      <div class="tagline">Swaran Soft voice agent</div>
    </div>
  </div>
  <nav class="top">
    <button class="models-btn" id="models-btn" onclick="openModelModal()" title="Switch the realtime model for inbound calls">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>
      <span id="model-badge">Loading model…</span>
    </button>
    <a href="/dashboard">Outbound</a>
    <a href="/dashboard/inbound" class="active">Inbound</a>
    <a href="/logout" class="logout">Log out</a>
  </nav>
</header>
<div id="wrap">
  <div class="kpi-row" id="kpis"></div>
  <div id="trend"></div>

  <table class="calls">
    <thead>
      <tr>
        <th>Name</th><th>Budget</th><th>Timeline</th><th>Decision Maker</th><th>Meeting</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">No inbound calls yet.</div>
</div>

<div id="overlay" onclick="closeDetail()"></div>
<div id="detail">
  <div class="dhead">
    <button class="dclose" onclick="closeDetail()" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div id="d-avatar-wrap"></div>
    <p class="dname" id="d-name"></p>
    <p class="dsub" id="d-sub"></p>
  </div>
  <div id="d-body"></div>
</div>

<div id="model-overlay" class="modal-overlay" onclick="closeModelModal(event)"></div>
<div id="model-modal" class="modal"></div>

<script src="/static/dashboard-common.js?v=3"></script>
<script>
let calls = [];

async function load() {
  const res = await fetch('/api/calls?direction=inbound');
  if (res.status === 401) { window.location = '/login'; return; }
  calls = await res.json();

  const unidentified = calls.filter(c => !c.name).length;
  document.getElementById('kpis').innerHTML = renderKpiRow(calls, [
    { icon: 'userCheck', accent: 'var(--warm)', label: 'Unidentified callers', val: unidentified.toLocaleString(), sub: 'name not captured' },
  ]);
  document.getElementById('trend').innerHTML = renderTrendCard(calls, 'Inbound call volume');

  const rows = document.getElementById('rows');
  document.getElementById('empty').style.display = calls.length ? 'none' : 'block';
  document.getElementById('empty').innerHTML = calls.length ? '' : `${ICON.inbox}<div>No inbound calls yet.</div>`;

  rows.innerHTML = calls.map((c, i) => `
    <tr onclick="openDetail(${i})">
      <td class="name-cell">${avatar(c.name, c.classification)}${esc(c.name) || '<span class="muted">Unknown caller</span>'}</td>
      <td>${esc(c.budget) || '<span class="muted">—</span>'}</td>
      <td>${esc(c.timeline) || '<span class="muted">—</span>'}</td>
      <td>${esc(c.decision_maker_status) || '<span class="muted">—</span>'}</td>
      <td>${meetingBadge(c)}</td>
    </tr>
  `).join('');
}

function openDetail(i) {
  const c = calls[i];
  document.getElementById('d-avatar-wrap').innerHTML = avatar(c.name, c.classification).replace('class="avatar"', 'class="avatar davatar"');
  document.getElementById('d-name').textContent = c.name || 'Unknown caller';
  document.getElementById('d-sub').textContent = [c.phone_number, c.classification].filter(Boolean).join(' · ');

  const aiCost = c.cost_usd != null ? '$' + Number(c.cost_usd).toFixed(4) : '—';
  const exotelCost = c.exotel_cost_inr != null ? '₹' + Number(c.exotel_cost_inr).toFixed(2) : '—';
  const totalCostV = c.total_cost_inr != null ? '₹' + Number(c.total_cost_inr).toFixed(2) : '—';
  const latency = c.avg_latency_s != null ? Number(c.avg_latency_s).toFixed(2) + 's' : '—';
  const duration = durationLabel(c.lead_state?.call_metrics?.call_duration_s);
  const turns = (c.transcript || []).length;

  const priced = c.engine
    ? `<p class="priced-against">Priced against <code>${esc(c.engine)}</code> / <code>${esc(c.model || '—')}</code></p>`
    : '';

  const recordingHtml = c.recording_url
    ? `<audio controls src="${c.recording_url}"></audio>`
    : `<p class="no-recording">No recording available for this call.</p>`;

  const transcriptHtml = (c.transcript || []).length
    ? `<div class="transcript">${c.transcript.map(m => `<div class="msg ${m.role}"><span class="role">${m.role}</span>${esc(m.content)}</div>`).join('')}</div>`
    : `<p class="no-recording">No transcript captured.</p>`;

  const u = c.usage || {};
  const n = (v) => v ?? 0;
  const totalInput = n(u.text_input) + n(u.audio_input);
  const totalOutput = n(u.text_output) + n(u.audio_output);
  const tokenUsageHtml = c.usage ? `
    <div class="tiles">
      <div class="tile">${icon('cpu', 'ticon')}<div class="tlabel">Total input tokens</div><div class="tval">${totalInput.toLocaleString()}</div></div>
      <div class="tile">${icon('cpu', 'ticon')}<div class="tlabel">Total output tokens</div><div class="tval">${totalOutput.toLocaleString()}</div></div>
    </div>
    <table class="utable">
      <thead><tr><th>Breakdown</th><th>Total</th><th>Cached</th></tr></thead>
      <tbody>
        <tr><td>Text input</td><td>${n(u.text_input).toLocaleString()}</td><td>${n(u.text_input_cached).toLocaleString()}</td></tr>
        <tr><td>Audio input</td><td>${n(u.audio_input).toLocaleString()}</td><td>${n(u.audio_input_cached).toLocaleString()}</td></tr>
        <tr><td>Text output</td><td>${n(u.text_output).toLocaleString()}</td><td>—</td></tr>
        <tr><td>Audio output</td><td>${n(u.audio_output).toLocaleString()}</td><td>—</td></tr>
        <tr class="total"><td>Total</td><td>${(totalInput + totalOutput).toLocaleString()}</td><td></td></tr>
      </tbody>
    </table>
  ` : `<p class="no-recording">No token usage recorded for this call.</p>`;

  document.getElementById('d-body').innerHTML = `
    <div class="section">
      <h3>${icon('phoneIn')}Call overview</h3>
      <div class="tiles">
        <div class="tile" style="--tile-accent: var(--cold)">${icon('clock', 'ticon')}<div class="tlabel">Duration</div><div class="tval">${duration}</div></div>
        <div class="tile" style="--tile-accent: var(--good)">${icon('chat', 'ticon')}<div class="tlabel">Turns</div><div class="tval">${turns}</div></div>
      </div>
      <dl class="kv" style="margin-top:0.7rem">
        <dt>${icon('globe')}Language</dt><dd>${fmt(c.preferred_language)}</dd>
      </dl>
    </div>
    <div class="section">
      <h3>${icon('building')}Caller</h3>
      <dl class="kv">
        <dt>Interest area</dt><dd>${fmt(c.interest_area)}</dd>
        <dt>${icon('mail')}Email</dt><dd>${fmt(c.email_id)}</dd>
      </dl>
    </div>
    <div class="section">
      <h3>${icon('userCheck')}Qualification</h3>
      <dl class="kv">
        <dt>Budget</dt><dd>${fmt(c.budget)}</dd>
        <dt>Timeline</dt><dd>${fmt(c.timeline)}</dd>
        <dt>Decision maker</dt><dd>${fmt(c.decision_maker_status)}</dd>
      </dl>
    </div>
    ${c.callback_time ? `
    <div class="section">
      <h3>${icon('phoneCallback')}Callback requested</h3>
      <dl class="kv"><dt>Time</dt><dd>${esc(c.callback_time)}</dd></dl>
    </div>` : ''}
    <div class="section">
      <h3>${icon('rupee')}Cost &amp; latency</h3>
      ${priced}
      <div class="tiles">
        <div class="tile"><div class="tlabel">AI cost</div><div class="tval">${aiCost}</div><div class="tsub">Gemini / OpenAI tokens</div></div>
        <div class="tile"><div class="tlabel">Telephony cost</div><div class="tval">${exotelCost}</div><div class="tsub">Exotel, per-minute</div></div>
        <div class="tile"><div class="tlabel">Total cost</div><div class="tval">${totalCostV}</div><div class="tsub">Blended, INR</div></div>
        <div class="tile"><div class="tlabel">Avg latency / turn</div><div class="tval">${latency}</div><div class="tsub">Time to first audio</div></div>
      </div>
    </div>
    <div class="section">
      <h3>${icon('cpu')}Token usage</h3>
      ${tokenUsageHtml}
    </div>
    <div class="section">
      <h3>${icon('mic')}Recording</h3>
      ${recordingHtml}
    </div>
    <div class="section">
      <h3>${icon('chat')}Transcript</h3>
      ${transcriptHtml}
    </div>
  `;

  document.getElementById('detail').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });

load();
setInterval(load, 15000);
initModelPicker('inbound');
</script>
</body>
</html>

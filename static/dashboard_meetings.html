      </div>

    </div>
    <nav class="side-nav">

      <a href="/dashboard/meetings" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/></svg><span class="nav-label">Meetings</span></a>

    <a href="/logout" class="logout-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg><span class="nav-label">Log out</span></a>
  </aside>

  <div class="main-area">
    <div class="page-topbar">
      <div>
        <h2>Meetings</h2>
        <p>Every booked discovery call, one list</p>
      </div>
      <div class="date-filter-bar">
        <label for="filter-from">From</label>
        <input type="date" id="filter-from">
        <label for="filter-to">To</label>
        <input type="date" id="filter-to">
        <button class="primary" onclick="applyDateFilter()">Apply</button>
        <button onclick="resetDateFilter()">Reset</button>
      </div>
    </div>
    <div id="wrap">
      <table class="calls">
        <thead>
          <tr>
            <th>Name</th><th>Direction</th><th>Meeting date</th><th>Agenda</th><th>Outcome</th><th>Join</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">No meetings booked yet.</div>
    </div>
  </div>
</div>

<script src="/static/dashboard-common.js?v=7"></script>
<script>
// meetingDateLabel() now lives in dashboard-common.js (shared with the Leads
// insight panel) — no local copy here anymore.

const OUTCOME_LABEL = { completed: 'Completed', no_show: 'No-show', pending: 'Pending' };

function outcomeActions(leadId, outcome) {
  return `<div class="outcome-actions">
    <button class="outcome-btn good ${outcome === 'completed' ? 'active' : ''}" onclick='toggleOutcome(${leadId}, "completed", "${outcome}")' title="Mark completed">${icon('calendarCheck')}</button>
    <button class="outcome-btn bad ${outcome === 'no_show' ? 'active' : ''}" onclick='toggleOutcome(${leadId}, "no_show", "${outcome}")' title="Mark no-show">${icon('phoneCallback')}</button>
    <span class="outcome-label ${outcome}">${OUTCOME_LABEL[outcome] || 'Pending'}</span>
  </div>`;
}

async function toggleOutcome(leadId, targetOutcome, currentOutcome) {
  const newOutcome = currentOutcome === targetOutcome ? null : targetOutcome;
  const res = await fetch(`/api/meetings/${leadId}/outcome`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ outcome: newOutcome }),
  });
  if (res.status === 401) { window.location = '/login'; return; }
  await load();
}

let allMeetings = [];
let dateFrom = null, dateTo = null;

// meeting_date is a full ISO datetime (see core/analytics.list_meetings) —
// compared against plain YYYY-MM-DD <input type="date"> values via a string
// slice rather than a Date object, so "2026-07-29" from the picker and
// "2026-07-29T10:00:00" from the API line up without a timezone conversion
// silently shifting a meeting into or out of the range.
function filterMeetingsByDate(meetings, from, to) {
  if (!from && !to) return meetings;
  return meetings.filter(m => {
    if (!m.meeting_date) return false;
    const day = m.meeting_date.slice(0, 10);
    if (from && day < from) return false;
    if (to && day > to) return false;
    return true;
  });
}

function applyDateFilter() {
  dateFrom = document.getElementById('filter-from').value || null;
  dateTo = document.getElementById('filter-to').value || null;
  renderRows();
}

function resetDateFilter() {
  document.getElementById('filter-from').value = '';
  document.getElementById('filter-to').value = '';
  dateFrom = null;
  dateTo = null;
  renderRows();
}

function renderRows() {
  const meetings = filterMeetingsByDate(allMeetings, dateFrom, dateTo);
  const rows = document.getElementById('rows');
  const empty = document.getElementById('empty');
  empty.style.display = meetings.length ? 'none' : 'block';
  if (!meetings.length) {
    empty.innerHTML = allMeetings.length
      ? `${ICON.inbox}<div>No meetings in this date range.</div>`
      : `${ICON.inbox}<div>No meetings booked yet.</div>`;
  }

  rows.innerHTML = meetings.map(m => `
    <tr>
      <td class="name-cell">${avatar(m.name)}${esc(m.name) || '<span class="muted">Unknown</span>'}</td>
      <td><span class="direction-tag ${m.direction === 'inbound' ? 'inbound' : 'outbound'}">${icon(m.direction === 'inbound' ? 'arrowIn' : 'arrowOut')}${m.direction === 'inbound' ? 'Inbound' : 'Outbound'}</span></td>
      <td class="mono">${meetingDateLabel(m.meeting_date)}</td>
      <td>${fmt(m.agenda)}</td>
      <td>${outcomeActions(m.lead_id, m.meeting_outcome)}</td>
      <td>${m.meeting_link ? `<a class="join-btn" href="${m.meeting_link}" target="_blank">${icon('calendarCheck')}Join</a>` : '<span class="muted">—</span>'}</td>
    </tr>
  `).join('');
}

async function load() {
  const res = await fetch('/api/meetings');
  if (res.status === 401) { window.location = '/login'; return; }
  allMeetings = await res.json();
  renderRows();
}

initSidebar();
load();
setInterval(load, 15000);
</script>
</body>
</html>
